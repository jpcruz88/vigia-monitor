name: Vigia

options:
  bundleIdPrefix: com.jpcruz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  VigiaCore:
    path: ../

targets:
  Vigia:
    type: application
    platform: macOS
    sources:
      - path: Vigia
    dependencies:
      - package: VigiaCore
        product: VigiaCore
    info:
      path: Vigia/Info.plist
      properties:
        CFBundleName: Vigía
        CFBundleDisplayName: Vigía
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # Sin icono en el Dock ni en Cmd-Tab: es una utilidad que se mira, no
        # una aplicación con la que se trabaja.
        LSUIElement: true
        NSHumanReadableCopyright: "jpsoftware.dev"
        NSInputMonitoringUsageDescription: >-
          Vigía mide los tiempos entre reportes del mouse para detectar
          pérdidas de señal del receptor inalámbrico. No registra qué teclas
          pulsas ni a dónde apuntas.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jpcruz.vigia
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Firma ad-hoc por omisión: es lo único que compila sin una cuenta de
        # desarrollador de Apple, así que cualquiera puede clonar el proyecto y
        # construirlo. Un equipo fijo aquí haría fallar la compilación a todo
        # el que no perteneciera a él.
        #
        # Tiene un coste que conviene saber: macOS identifica una app ad-hoc por
        # el hash de su binario, así que cada recompilación es una app distinta
        # para el sistema y hay que volver a conceder el permiso de
        # Monitorización de entrada. Quien tenga cuenta puede evitarlo pasando
        # su equipo:  VIGIA_TEAM=SU_EQUIPO ./rebuild.sh
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # El sandbox de macOS bloquea IOHIDManager, que es lo que necesita el
        # detector de trabones. Esta app no va a la Mac App Store.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
