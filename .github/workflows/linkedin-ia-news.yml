name: Noticias de IA a LinkedIn

on:
  schedule:
    # Todos los días a las 13:00 UTC. Cambia la hora aquí (formato cron, en UTC).
    - cron: "0 13 * * *"
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:
    inputs:
      prueba:
        description: "Solo mostrar el post, sin publicar"
        type: boolean
        default: false

permissions:
  contents: write  # para guardar publicadas.json en el repo

concurrency:
  group: linkedin-ia-news

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linkedin-ia-news
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: linkedin-ia-news/requirements.txt

      - run: pip install -r requirements.txt

      - name: Buscar, redactar y publicar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        run: python publicar.py ${{ inputs.prueba && '--prueba' || '' }}

      - name: Guardar historial de noticias publicadas
        run: |
          if [ -n "$(git status --porcelain publicadas.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add publicadas.json
            git commit -m "linkedin-ia-news: actualizar historial"
            git push
          fi
